---
all:
  hosts:
    homeserver-test:
      ansible_host: "{{ lookup('env', 'VM_IP') }}"
      ansible_user: ubuntu
      ansible_ssh_private_key_file: "{{ lookup('env', 'VM_KEY') }}"
      ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      bind_ip: "{{ lookup('env', 'VM_IP') }}"
      lan_cidr: 192.168.252.0/24
      vpn_interface: tailscale0
      apps_dir: /home/ubuntu/apps
      apps_skip: [cloudflared]
