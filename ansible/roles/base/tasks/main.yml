---
- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, unattended-upgrades]
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Enable unattended upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  become: true

- name: Allow binding the VPN address before the interface is up
  ansible.builtin.copy:
    src: 90-nonlocal-bind.conf
    dest: /etc/sysctl.d/90-nonlocal-bind.conf
    mode: "0644"
  become: true
  notify: Reload sysctl

- name: Allow SSH keys only
  ansible.builtin.copy:
    src: 00-key-only.conf
    dest: /etc/ssh/sshd_config.d/00-key-only.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  become: true
  notify: Reload ssh
